services:
  - type: web
    name: location-guardian
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: cd dist && node server/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: FORCE_AUTHN_INNERAPI_DOMAIN
        value: http://platform.local
      - key: DEPRECATED_SKIP_INIT_DB_CONNECTION
        value: "1"
    healthCheckPath: /
    autoDeploy: yes