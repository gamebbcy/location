services:
  - type: web
    name: location-guardian
    runtime: static
    buildCommand: npm ci && npm run build:client
    staticPublishPath: ./dist/client
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_AMAP_KEY
        sync: false
      - key: VITE_AMAP_SECURITY_CODE
        sync: false
      - key: VITE_WEATHER_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: commit
