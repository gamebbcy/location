services:
  - type: web
    name: location-guardian
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: cd dist && node server/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
    healthCheckPath: /
    autoDeploy: yes